[workspace]
resolver = "3"
# Crates are added when a build-order step needs them (ADR-0034).
members = ["crates/*", "xtask"]
# The spikes are frozen measurement code, not workspace members (architecture §11.1).
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Every third-party dependency is declared here once; crates use `foo.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2"
miette = "7"
blake3 = "1"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
proptest = "1"
insta = { version = "1", features = ["ron"] }
cargo_metadata = "0.23"
toml = "0.9"
regex = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# The dependency list is fixed by the walking-skeleton spec before the crates that use
# it exist. Drop this once every entry has a user.
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

# Research 09 §6.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
float_cmp = "deny"
dbg_macro = "deny"
# Allowed in #[test] functions through clippy.toml; integration-test helpers allow it locally.
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
