# cargo-deny: advisories, licences and bans for the whole dependency graph.
# The crate dependency rules of ADR-0034 are enforced by `cargo xtask deps`, not here.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, including unmaintained and unsound crates.
ignore = []

[licenses]
# Permissive licences only: the repo and every binary are MIT (ADR-0004).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# Allowances for licences new crates will bring in (blake3, miette, num-*).
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`; they are checked by `xtask deps` instead.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # The disk cache is postcard (ADR-0038); bincode is unmaintained.
  { crate = "bincode", reason = "ADR-0038: use postcard" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
