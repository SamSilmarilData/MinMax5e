name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # The cross-target result hash (ADR-0050): evaluation must give the same bits
      # natively and under wasmtime. The ignored tests show that a mismatch fails.
      - if: runner.os == 'macOS'
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime@51.0.0
      - if: runner.os == 'macOS'
        run: cargo xtask xhash
      - if: runner.os == 'macOS'
        run: cargo test --locked --package xtask --test xhash -- --ignored

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every crate except the native CLI and the xtask dev tool must build for the
      # browser (ADR-0034, ADR-0042).
      - name: cargo check --target wasm32-unknown-unknown
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name | select(. != "mm-cli" and . != "xtask") | "--package=" + .')
          if [ -n "$packages" ]; then
            cargo check --locked --target wasm32-unknown-unknown $packages
          else
            echo "No library crates yet; only the canary below runs."
          fi
      # A canary that compiles only if .cargo/config.toml's +simd128 reaches wasm builds.
      - name: wasm32 simd128 canary
        run: |
          mkdir -p target/wasm-canary/src
          printf '[package]\nname = "wasm-canary"\nversion = "0.0.0"\nedition = "2024"\npublish = false\n\n[workspace]\n' \
            > target/wasm-canary/Cargo.toml
          printf '#![no_std]\n#[cfg(not(target_feature = "simd128"))]\ncompile_error!("simd128 is not enabled for wasm32: check .cargo/config.toml");\n' \
            > target/wasm-canary/src/lib.rs
          for target in wasm32-unknown-unknown wasm32-wasip1; do
            cargo check --manifest-path target/wasm-canary/Cargo.toml --target "$target"
          done

  guards:
    name: repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # adr-check compares with an earlier commit.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask deps
      - run: cargo xtask leak-scan
      - run: cargo xtask glossary
      # The 2024 Ruleset's embedded encodings load cleanly. Records stay in the local cache
      # (ADR-0028), so ADR-0002's coverage check runs locally, not here.
      - run: cargo run --locked -q -p mm-cli -- validate-packs
      # Accepted ADRs change only by dated amendment. Accepted text is what is on main, so
      # a branch compares with main (the pull request's base, or origin/main for a push) and
      # may revise amendments it has not merged yet. A push to main compares with the main
      # before it.
      - name: cargo xtask adr-check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=origin/main
          fi
          cargo xtask adr-check --base "$BASE"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
