# The fixture Builds `cargo xtask xhash` evaluates natively and under wasmtime, then
# hashes (ADR-0050). The result must hash alike on both targets.
#
# Every Build in crates/mm-testkit/fixtures/builds/ must be listed here; the xtask test
# `every_fixture_build_is_in_the_hashed_set` fails otherwise. To add one, append an entry:
#
#   [[build]]
#   path = "crates/mm-testkit/fixtures/builds/<name>.ron"  # relative to the repo root
#   assumptions = "crates/mm-testkit/fixtures/assumptions/<name>.ron"  # optional
#   ac = 16                                                 # optional: the target AC
#   hp = 30                                                 # optional: the target's HP
#   rulings = "crates/mm-testkit/fixtures/ruling-sets/<name>.ron"  # optional
#
# Each Build is evaluated with `mm-cli evaluate <path> [--assumptions <file>] [--ac <ac>]
# [--hp <hp>] [--rulings <file>] --format ron` on the fixture pack,
# `crates/mm-testkit/fixtures/pack`. With none of `assumptions`, `ac` and `hp`, the target
# is the Encounter Baseline for the Build's level; without `rulings`, every Ruling takes
# its default. A Build may be listed more than once, with different flags. Adding or
# reordering entries changes the hash; only agreement between the two targets matters,
# not its value.

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-1.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-5.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-5-no-hew.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-5-no-graze.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-5-no-style.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-1.ron"
assumptions = "crates/mm-testkit/fixtures/assumptions/hand-count.ron"

[[build]]
path = "crates/mm-testkit/fixtures/builds/warrior-5.ron"
rulings = "crates/mm-testkit/fixtures/ruling-sets/hew-with-pb.ron"
