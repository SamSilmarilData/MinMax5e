  { path = "f64::asinh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::asinh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::acosh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::acosh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::atanh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::atanh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::cbrt", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::cbrt", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::hypot", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::hypot", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::max", reason = "NaN-unsafe; compare explicitly or use total_cmp (ADR-0037, ADR-0050)" },
  { path = "f32::max", reason = "NaN-unsafe; compare explicitly or use total_cmp (ADR-0037, ADR-0050)" },
  { path = "f64::min", reason = "NaN-unsafe; compare explicitly or use total_cmp (ADR-0037, ADR-0050)" },
  { path = "f32::min", reason = "NaN-unsafe; compare explicitly or use total_cmp (ADR-0037, ADR-0050)" },
  # Hash-map order differs natively and on wasm32 (FxHash hashes in usize): iterate a Vec,
  # and look up through the map (research 09 errata). A `for` loop over `&map` is not caught.
  { path = "std::collections::HashMap::iter", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::iter_mut", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::keys", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::values", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::values_mut", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::drain", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::into_keys", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
  { path = "std::collections::HashMap::into_values", reason = "iteration order differs across targets; iterate a Vec (ADR-0050)" },
]

# Terms written in docs as they are (`..` keeps clippy's defaults).
doc-valid-idents = ["CVaR", ".."]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
