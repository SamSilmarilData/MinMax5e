# Cross-target determinism (ADR-0037, ADR-0050 as amended 2026-11-27). Scored values use
# IEEE 754 basic operations only, so `sqrt` (correctly rounded everywhere) is allowed.
# Banned: fused multiply-add, transcendentals, `powi` (Rust documents its precision as
# non-deterministic), max/min (NaN-unsafe), and HashMap's iterating methods (order differs
# natively and on wasm32). A display-only helper
# may allow one locally with `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
  { path = "f64::mul_add", reason = "fused multiply-add rounds differently from a * b + c (ADR-0050)" },
  { path = "f32::mul_add", reason = "fused multiply-add rounds differently from a * b + c (ADR-0050)" },
  { path = "f64::powi", reason = "precision is documented as non-deterministic; multiply explicitly (ADR-0050)" },
  { path = "f32::powi", reason = "precision is documented as non-deterministic; multiply explicitly (ADR-0050)" },
  { path = "f64::powf", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::powf", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::exp", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::exp", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::exp2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::exp2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::exp_m1", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::exp_m1", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::ln", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::ln", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::ln_1p", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::ln_1p", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::log", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::log", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::log2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::log2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::log10", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::log10", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::sin", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::sin", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::cos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::cos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::tan", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::tan", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::sin_cos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::sin_cos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::asin", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::asin", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::acos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::acos", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::atan", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::atan", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::atan2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::atan2", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f64::sinh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
  { path = "f32::sinh", reason = "transcendental: precision unspecified, not bit-identical across targets (ADR-0050)" },
